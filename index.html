<style>

:root[data-theme="dark"]{--bg:#121a15;--ink:#e8ede6;--mut:#9aa89c;--line:#2c3a30;--acc:#5fbf8a;--on:#0d1510;--sel:#1d2d22;--wn:#e8a45c;color-scheme:dark}
html{background:var(--bg)}
body{margin:0;padding:18px 16px 40px;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,sans-serif;max-width:1000px;margin-inline:auto}
h1{font-size:1.5rem;margin:.2rem 0 .3rem}
.s,.m{color:var(--mut)}p.s{margin:0 0 1.2rem}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:12px}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mut);gap:4px}

.btn{font:inherit;font-weight:600;padding:10px 16px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--on);cursor:pointer}
.btn.o{background:transparent;color:var(--acc)}

#f{display:none}
#st{margin:8px 0 14px;min-height:1.4em}
section{margin-bottom:24px}
.fn{flex:1 0 100%;display:flex;gap:10px;align-items:baseline;overflow-wrap:anywhere}
.fn .x{margin-left:auto;font:inherit;background:none;border:0;color:var(--mut);font-size:1.2rem;padding:2px 8px;cursor:pointer}
.wn{color:var(--wn);margin:0 0 10px;font-size:.9rem}
.w{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
th{font-weight:600;color:var(--mut);font-size:.85rem}
td.n{text-align:right}
tr.on td{background:var(--sel)}
tr:last-child td{border-bottom:0}
textarea{width:100%;height:120px;margin-top:10px;font:13px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px}
</style></head>

      }
      const nb={li,games:nw};pick(nb);
      const all=o.games.map((g,i)=>({g,s:o.sel[i]})).concat(nw.map((g,i)=>({g,s:nb.sel[i]})));
      all.sort((x,y)=>ts(x.g)-ts(y.g));
      o.games=all.map(x=>x.g);o.sel=all.map(x=>x.s);
      if(nw.length||up)o.files.push(fo);
      o.files=o.files.filter(x=>o.games.some(g=>g.f==x));
      msg.push(PLAN[li].n+": "+nw.length+" neu"+(up?", "+up+" aktualisiert":"")+(old?", "+old+" älter (übersprungen)":""));
    }catch(x){msg.push(f.name+": "+x.message)}
  }
  blocks.sort((a,b)=>a.li-b.li);render();say(msg.join(" · "));e.target.value="";
};
$("bl").onchange=e=>{
  const t=e.target,b=blocks[+t.closest("section").dataset.k];
  if(t.classList.contains("td")&&t.value){const fo=b.files[+t.dataset.f];fo.today=new Date(t.value+"T00:00");fo.src="manuell";render()}
  else if(t.dataset.i!=null){b.sel[t.dataset.i]=t.checked;t.closest("tr").classList.toggle("on",t.checked)}
};
$("bl").onclick=e=>{
  if(!e.target.classList.contains("x"))return;
  blocks.splice(+e.target.closest("section").dataset.k,1);render();
};
$("cp").onclick=async()=>{
  const t=tsv(),ok1="Kopiert. Jetzt in Numbers oder Excel einfügen.";
  try{await navigator.clipboard.writeText(t);say(ok1)}
  catch(x){
    const a=$("ta");a.hidden=false;a.value=t;a.focus();a.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(y){}
    say(ok?ok1:"Text ist markiert, bitte manuell kopieren.");
  }
};
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body></html>
